name: Courses service cutover

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Confirm the write freeze and courses service cutover
        required: true
        default: false
        type: boolean

concurrency:
  group: sms-courses-service-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AZURE_CLIENT_ID: dfd6e7ba-fca0-482a-a91c-fa4b3143446d
      AZURE_TENANT_ID: 816691e0-63cf-49e9-be3f-b237b7e2f6ca
      AZURE_SUBSCRIPTION_ID: 74577974-a069-4c7e-90ea-9f06a0aaa0f5
      AZURE_RESOURCE_GROUP: work
      APP_NAME: sms-student-management-20261103
      POSTGRES_SERVER: sms-student-management-pg-20261103
      COURSES_APP: sms-courses-api
      COURSES_ENVIRONMENT: sms-courses-aca-env
      LOG_WORKSPACE_ID: 29ad2ea6-d358-4fae-bb8b-d479f1aa6e13
      WEBAPP_URL: https://sms-student-management-20261103.azurewebsites.net
      COURSES_IMAGE: ghcr.io/xipasha/monolithic-student-management-system:${{ github.sha }}
      COURSES_MIN_REPLICAS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install database client
        run: python -m pip install --quiet psycopg2-binary

      - name: Freeze, migrate, compare, cut over, and rehearse rollback
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COURSES_DATABASE_URL: ${{ secrets.COURSES_DATABASE_URL }}
          COURSES_SERVICE_TOKEN: ${{ secrets.COURSES_SERVICE_TOKEN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          COURSES_SERVICE_URL: ${{ vars.COURSES_SERVICE_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          if [[ "${{ inputs.confirm_cutover }}" != "true" ]]; then
            echo "Set confirm_cutover=true to execute the requested cutover." >&2
            exit 1
          fi

          if [[ -z "$ADMIN_PASSWORD" || -z "$DATABASE_URL" || -z "$COURSES_DATABASE_URL" || \
                -z "$COURSES_SERVICE_TOKEN" || -z "$POSTGRES_ADMIN_PASSWORD" || -z "$COURSES_SERVICE_URL" ]]; then
            echo "Cutover secrets or courses URL are not configured." >&2
            exit 1
          fi

          flag_enabled=false
          rollback_window_safe=false
          app_frozen=false
          firewall_created=false
          firewall_rule="cutover-${GITHUB_RUN_ID}"

          deploy_courses_bicep() {
            local replica_count="$1"
            az deployment group create \
              --name "courses-cutover-${GITHUB_RUN_ID}-${replica_count}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/courses-container-app.bicep \
              --parameters location=southafricanorth \
                managedEnvironmentName="$COURSES_ENVIRONMENT" \
                containerAppName="$COURSES_APP" \
                containerImage="$COURSES_IMAGE" \
                coursesServiceToken="$COURSES_SERVICE_TOKEN" \
                coursesDatabaseUrl="$COURSES_DATABASE_URL" \
                minReplicas="$replica_count" \
              --output none
          }

          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if [[ "$status" -eq 0 ]]; then
              echo "Cutover stages passed; restoring ACA minimum replicas to 0 through Bicep."
              deploy_courses_bicep 0 || status=$?
              gh variable set COURSES_SERVICE_MIN_REPLICAS --body 0 || status=$?
            elif [[ "$rollback_window_safe" == true ]]; then
              echo "A failure occurred in the rehearsed safe window; restoring the courses flag to true."
              az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$APP_NAME" --settings COURSES_SERVICE_ENABLED=true --output none
              gh variable set COURSES_SERVICE_ENABLED --body true || status=$?
              az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
              deploy_courses_bicep 0 || status=$?
              gh variable set COURSES_SERVICE_MIN_REPLICAS --body 0 || status=$?
              flag_enabled=true
            elif [[ "$flag_enabled" != true ]]; then
              echo "Cutover stopped before service writes; keeping the flag off and restoring service availability."
              az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$APP_NAME" --settings COURSES_SERVICE_ENABLED=false --output none
              gh variable set COURSES_SERVICE_ENABLED --body false || status=$?
              az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
              deploy_courses_bicep 0 || status=$?
              gh variable set COURSES_SERVICE_MIN_REPLICAS --body 0 || status=$?
            else
              echo "Cutover stopped after service writes may have started; preserving the enabled flag and min=1."
              gh variable set COURSES_SERVICE_ENABLED --body true || status=$?
              gh variable set COURSES_SERVICE_MIN_REPLICAS --body 1 || status=$?
              az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
            fi
            if [[ "$firewall_created" == true ]]; then
              az postgres flexible-server firewall-rule delete \
                --resource-group "$AZURE_RESOURCE_GROUP" --server-name "$POSTGRES_SERVER" \
                --name "$firewall_rule" --yes --output none || status=$?
              echo "Removed temporary PostgreSQL firewall rule $firewall_rule."
            fi
            if [[ "$status" -ne 0 ]]; then
              echo "Cutover cleanup returned status $status." >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT

          current_flag="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --query "[?name=='COURSES_SERVICE_ENABLED'].value | [0]" --output tsv)"
          if [[ "$current_flag" != "false" ]]; then
            echo "Precondition failed: COURSES_SERVICE_ENABLED must be false, found '$current_flag'." >&2
            exit 1
          fi
          gh variable set COURSES_SERVICE_ENABLED --body false
          az bicep build --file infra/courses-container-app.bicep --outfile "$RUNNER_TEMP/courses-container-app.json"
          echo "Preflight passed: courses flag is false; monolith remains on the legacy course tables."

          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" --server-name "$POSTGRES_SERVER" \
            --name "$firewall_rule" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" \
            --output none
          firewall_created=true
          echo "Opened temporary PostgreSQL access for this GitHub runner only."

          echo "Applying courses Container App minimum=1 with Bicep for cutover."
          deploy_courses_bicep 1
          live_min="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$COURSES_APP" \
            --query properties.template.scale.minReplicas --output tsv)"
          if [[ "$live_min" != "1" ]]; then
            echo "Bicep did not set the expected minimum replica count." >&2
            exit 1
          fi
          gh variable set COURSES_SERVICE_MIN_REPLICAS --body 1
          replica_count=0
          for attempt in $(seq 1 10); do
            replica_count="$(az containerapp replica list --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$COURSES_APP" --query 'length(@)' --output tsv 2>/dev/null || echo 0)"
            if [[ "$replica_count" =~ ^[0-9]+$ ]] && [[ "$replica_count" -ge 1 ]]; then break; fi
            sleep 3
          done
          if [[ ! "$replica_count" =~ ^[0-9]+$ ]] || [[ "$replica_count" -lt 1 ]]; then
            echo "Courses service has no running replica at min=1." >&2
            exit 1
          fi
          echo "ACA capacity: min=1, running replicas=$replica_count; estimated idle cost about $5.83/month gross or $4.21 after unused monthly grants. If continuously active, estimate up to $19.44 gross or $14.04 after grants. Excludes Log Analytics ingestion."
          curl --fail --silent --show-error --max-time 5 "$COURSES_SERVICE_URL/health"
          curl --fail --silent --show-error --max-time 5 \
            --header "Authorization: Bearer $COURSES_SERVICE_TOKEN" "$COURSES_SERVICE_URL/ready"

          export COURSES_ADMIN_DATABASE_URL="$(python -c 'import os; from urllib.parse import quote; print("postgresql://smsadmin:" + quote(os.environ["POSTGRES_ADMIN_PASSWORD"], safe="") + "@sms-student-management-pg-20261103.postgres.database.azure.com:5432/sms?sslmode=require")')"
          export SOURCE_DATABASE_URL="$DATABASE_URL"
          python - <<'PY'
          import os
          import psycopg2

          for name, key in (("legacy", "SOURCE_DATABASE_URL"), ("courses", "COURSES_ADMIN_DATABASE_URL")):
              with psycopg2.connect(os.environ[key]) as connection, connection.cursor() as cursor:
                  if name == "legacy":
                      cursor.execute("SELECT (SELECT count(*) FROM courses), (SELECT count(*) FROM enrolments)")
                  else:
                      cursor.execute("SET search_path TO courses")
                      cursor.execute("SELECT (SELECT count(*) FROM courses), (SELECT count(*) FROM enrolments)")
                  courses, enrolments = cursor.fetchone()
                  print(f"database_preflight={name} courses={courses} enrolments={enrolments}")
          PY
          echo "Read-only database preflight passed; beginning the course/enrolment write freeze."
          freeze_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "write_freeze_started=$freeze_started"
          az webapp stop --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
          app_frozen=true
          for attempt in $(seq 1 30); do
            state="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME" --query state --output tsv)"
            if [[ "$state" == "Stopped" ]]; then break; fi
            sleep 2
          done
          if [[ "$state" != "Stopped" ]]; then
            echo "App Service did not reach Stopped state; aborting the write freeze." >&2
            exit 1
          fi
          echo "write_freeze_confirmed=App Service Stopped; course and enrolment writes are frozen."

          python scripts/migrate-courses-to-service.py
          python scripts/compare-courses-service.py
          echo "Comparison gate passed with zero mismatches; only now enabling the courses service."
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --settings COURSES_SERVICE_ENABLED=true --output none
          flag_enabled=true
          app_frozen=false
          az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 4 "$WEBAPP_URL/health"; then
              break
            fi
            if [[ "$attempt" -eq 40 ]]; then
              echo "Monolith did not become healthy after cutover." >&2
              exit 1
            fi
            sleep 3
          done
          freeze_ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "write_freeze_ended=$freeze_ended"
          echo "COURSES_SERVICE_ENABLED=true; monolith is healthy and serving courses through ACA."

          export CUTOVER_CORRELATION_ID="cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e"
          python scripts/courses-cutover-e2e.py
          echo "Waiting for correlated monolith and courses service request logs."
          monolith_log_dir="$RUNNER_TEMP/cutover-monolith-logs"
          mkdir -p "$monolith_log_dir"
          az webapp log download --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME" \
            --log-file "$monolith_log_dir/logs.zip" --output none
          unzip -q -o "$monolith_log_dir/logs.zip" -d "$monolith_log_dir/extracted"
          if ! rg --no-line-number --fixed-strings "$CUTOVER_CORRELATION_ID" \
            "$monolith_log_dir/extracted/LogFiles"; then
            echo "Monolith did not retain the E2E correlation ID in its logs." >&2
            exit 1
          fi

          service_logs=""
          az extension add --name log-analytics --only-show-errors
          query="ContainerAppConsoleLogs_CL | where TimeGenerated > ago(30m) | where Log_s contains '$CUTOVER_CORRELATION_ID' | project TimeGenerated, Log_s | order by TimeGenerated asc"
          for attempt in $(seq 1 12); do
            service_logs="$(az monitor log-analytics query --workspace "$LOG_WORKSPACE_ID" \
              --analytics-query "$query" --output tsv 2>/dev/null || true)"
            if [[ "$service_logs" == *"$CUTOVER_CORRELATION_ID"* ]]; then break; fi
            sleep 5
          done
          if [[ "$service_logs" != *"$CUTOVER_CORRELATION_ID"* ]]; then
            echo "Courses service did not retain the E2E correlation ID in Log Analytics." >&2
            exit 1
          fi
          echo "Courses service logs for the E2E correlation ID:"
          echo "$service_logs"

          python scripts/compare-courses-service.py
          echo "Post-test cleanup comparison also reports zero mismatches."
          rollback_window_safe=true

          echo "Rehearsing safe-window rollback: flag off, legacy dashboard check, flag on."
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --settings COURSES_SERVICE_ENABLED=false --output none
          flag_enabled=false
          az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 4 "$WEBAPP_URL/health"; then break; fi
            if [[ "$attempt" -eq 40 ]]; then exit 1; fi
            sleep 3
          done
          observed_flag="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --query "[?name=='COURSES_SERVICE_ENABLED'].value | [0]" --output tsv)"
          if [[ "$observed_flag" != "false" ]]; then
            echo "Flag-off rollback rehearsal did not persist." >&2
            exit 1
          fi
          python scripts/courses-cutover-check.py
          echo "Rollback check passed with COURSES_SERVICE_ENABLED=false."

          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --settings COURSES_SERVICE_ENABLED=true --output none
          flag_enabled=true
          gh variable set COURSES_SERVICE_ENABLED --body true
          az webapp start --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 4 "$WEBAPP_URL/health"; then break; fi
            if [[ "$attempt" -eq 40 ]]; then exit 1; fi
            sleep 3
          done
          observed_flag="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" --query "[?name=='COURSES_SERVICE_ENABLED'].value | [0]" --output tsv)"
          if [[ "$observed_flag" != "true" ]]; then
            echo "Flag-on restoration did not persist." >&2
            exit 1
          fi
          python scripts/courses-cutover-check.py
          echo "Rollback rehearsal complete: flag off and checked, then restored on and checked."
          app_frozen=false
