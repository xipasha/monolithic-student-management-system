
name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Deploy with an invalid App Service port to rehearse automatic rollback
        required: true
        default: false
        type: boolean

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sms_test
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build infrastructure templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep --outfile /tmp/sms-main.json
            az bicep build --file infra/courses-container-app.bicep --outfile /tmp/sms-courses-container-app.json
            az bicep build --file infra/what-if-role.bicep --outfile /tmp/sms-what-if-role.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run automated tests with coverage gate
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://sms:test-password@localhost:5432/sms_test' || '' }}
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=60

  container-build-smoke:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build container image
        run: docker build --pull -t student-management-system:${{ github.sha }} .

      - name: Start container and verify health endpoint
        run: |
          docker run --detach --name student-management-system-smoke \
            --publish 8000:8000 \
            --env SECRET_KEY=ci-test-secret \
            --env PORT=8000 \
            student-management-system:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker rm --force student-management-system-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs student-management-system-smoke
          docker rm --force student-management-system-smoke
          exit 1

  notifier-container-build-smoke:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build worker container image
        run: docker build --pull -f services/notifier/Dockerfile -t student-management-notifier:${{ github.sha }} .

      - name: Start worker and verify health endpoint
        run: |
          docker run --detach --name student-management-notifier-smoke \
            --publish 8001:8000 \
            student-management-notifier:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health; then
              docker rm --force student-management-notifier-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs student-management-notifier-smoke
          docker rm --force student-management-notifier-smoke
          exit 1

  courses-container-build-smoke:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build the existing public image with the courses entry point
        run: docker build --pull -t student-management-courses:${{ github.sha }} .

      - name: Start courses image and verify liveness
        run: |
          docker run --detach --name student-management-courses-smoke \
            --publish 8002:8000 \
            --env COURSES_SERVICE_TOKEN=ci-test-token \
            --env APP_MODULE=services.courses.app:app \
            student-management-courses:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/health; then
              docker rm --force student-management-courses-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs student-management-courses-smoke
          docker rm --force student-management-courses-smoke
          exit 1

  publish-image:
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [tests, container-build-smoke, notifier-container-build-smoke, courses-container-build-smoke]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged with commit SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Build and push notifications worker image tagged with commit SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/notifier/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-notifier:${{ github.sha }}


  deploy-app-service:
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [tests, container-build-smoke, notifier-container-build-smoke, publish-image]
    concurrency:
      group: sms-app-service-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: dfd6e7ba-fca0-482a-a91c-fa4b3143446d
      AZURE_TENANT_ID: 816691e0-63cf-49e9-be3f-b237b7e2f6ca
      AZURE_SUBSCRIPTION_ID: 74577974-a069-4c7e-90ea-9f06a0aaa0f5
      AZURE_RESOURCE_GROUP: work
      AZURE_WEBAPP_NAME: sms-student-management-20261103
      AZURE_NOTIFIER_WEBAPP_NAME: sms-student-management-20261103-notifier
      AZURE_SERVICEBUS_NAMESPACE_NAME: sms-student-events-20261104
      AZURE_SERVICEBUS_NAMESPACE_FQDN: sms-student-events-20261104.servicebus.windows.net
      AZURE_APPSERVICE_PLAN_NAME: sikalumbit30_asp_8006
      AZURE_IDENTITY_NAME: sms-github-deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Confirm image is anonymously pullable
        run: docker pull "ghcr.io/xipasha/monolithic-student-management-system:${{ github.sha }}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check Bicep template against live Azure resources
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COURSES_SERVICE_TOKEN: ${{ secrets.COURSES_SERVICE_TOKEN }}
          COURSES_DATABASE_URL: ${{ secrets.COURSES_DATABASE_URL }}
          COURSES_SERVICE_URL: ${{ vars.COURSES_SERVICE_URL }}
          COURSES_SERVICE_ENABLED: ${{ vars.COURSES_SERVICE_ENABLED || 'false' }}
        run: bash scripts/infra-whatif.sh

      - name: Record currently configured App Service runtime
        id: previous
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          previous_runtime="$(az webapp config show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query linuxFxVersion --output tsv)"
          if [[ -z "$previous_runtime" || "$previous_runtime" == "None" ]]; then
            echo "Could not determine the currently configured App Service runtime." >&2
            exit 1
          fi
          if [[ "$SIMULATE_FAILURE" == "true" && "$previous_runtime" != "DOCKER|ghcr.io/xipasha/monolithic-student-management-system:"* ]]; then
            echo "Failure simulation requires an existing GHCR container image to restore." >&2
            exit 1
          fi
          echo "runtime=$previous_runtime" >> "$GITHUB_OUTPUT"

      - name: Deploy commit-SHA image
        id: deploy
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "Simulating deployment failure with WEBSITES_PORT=9999."
            bash scripts/deploy-container.sh "${{ github.sha }}" 9999
            configured_port="$(az webapp config appsettings list \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name=='WEBSITES_PORT'].value | [0]" --output tsv)"
            if [[ "$configured_port" != "9999" ]]; then
              echo "Expected WEBSITES_PORT=9999, got '$configured_port'." >&2
              exit 1
            fi
            az webapp restart \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP"
          else
            bash scripts/deploy-container.sh "${{ github.sha }}"
          fi

      - name: Configure courses service endpoint without enabling cutover
        if: steps.deploy.outcome == 'success' && inputs.simulate_failure != true
        env:
          COURSES_SERVICE_TOKEN: ${{ secrets.COURSES_SERVICE_TOKEN }}
          COURSES_SERVICE_URL: ${{ vars.COURSES_SERVICE_URL }}
          COURSES_SERVICE_ENABLED: ${{ vars.COURSES_SERVICE_ENABLED || 'false' }}
        run: |
          if [[ -z "$COURSES_SERVICE_TOKEN" || -z "$COURSES_SERVICE_URL" ]]; then
            echo "Courses service shared token or URL is not configured." >&2
            exit 1
          fi
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings COURSES_SERVICE_ENABLED="$COURSES_SERVICE_ENABLED" \
              COURSES_SERVICE_URL="$COURSES_SERVICE_URL" \
              COURSES_SERVICE_TOKEN="$COURSES_SERVICE_TOKEN" --output none

      - name: Wait for application health
        id: health
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          health_url="https://sms-student-management-20261103.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            status_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 4 "$health_url" || true)"
            if [[ "$status_code" == "200" ]]; then
              if [[ "$SIMULATE_FAILURE" == "true" ]]; then
                echo "App Service is still serving a healthy response while the bad-port restart propagates."
              else
                curl --fail --silent --show-error "$health_url"
                exit 0
              fi
            elif [[ "$SIMULATE_FAILURE" == "true" ]]; then
              echo "Observed expected unhealthy HTTP status '$status_code' from the bad-port deployment."
              exit 1
            else
              echo "Health check returned HTTP status '$status_code'."
            fi
            sleep 2
          done
          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "Failure simulation did not produce an unhealthy response before timeout." >&2
          else
            echo "Application health check did not return HTTP 200 within 3 minutes." >&2
          fi
          exit 1

      - name: Install PostgreSQL client for verification cleanup
        if: steps.health.outcome == 'success' && inputs.simulate_failure != true
        run: python -m pip install --quiet psycopg2-binary

      - name: Verify live administrator and student logins
        id: verify-logins
        if: steps.health.outcome == 'success' && inputs.simulate_failure != true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEBAPP_URL: https://sms-student-management-20261103.azurewebsites.net
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import html
          import os
          import psycopg2
          import re
          import secrets
          import time
          from http.cookiejar import CookieJar
          from urllib.parse import urlencode, urljoin
          from urllib.request import HTTPCookieProcessor, Request, build_opener

          base_url = os.environ["WEBAPP_URL"].rstrip("/")
          admin_password = os.environ["ADMIN_PASSWORD"]
          run_id = os.environ["TEST_RUN_ID"]
          test_students = [f"STEP5{run_id}{attempt}" for attempt in range(1, 6)]
          admin = build_opener(HTTPCookieProcessor(CookieJar()))

          def post(opener, path, values, correlation_id):
              request = Request(
                  urljoin(base_url + "/", path.lstrip("/")),
                  data=urlencode(values).encode(),
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded",
                      "X-Correlation-ID": correlation_id,
                  },
              )
              started = time.monotonic()
              print(f"request_start path={path} correlation_id={correlation_id}", flush=True)
              with opener.open(request, timeout=30) as response:
                  body = response.read().decode()
                  elapsed = time.monotonic() - started
                  print(
                      f"request_done path={path} status={response.status} "
                      f"elapsed_seconds={elapsed:.3f} correlation_id="
                      f"{response.headers.get('X-Correlation-ID', correlation_id)}",
                      flush=True,
                  )
                  return response.geturl(), body

          admin_url, admin_page = post(
              admin, "/login", {"login_id": "admin", "password": admin_password},
              f"gha-{run_id}-admin-login",
          )
          if not admin_url.endswith("/admin") or "Administrator Dashboard" not in admin_page:
              raise SystemExit("Administrator login verification failed.")

          attempted_students = []
          try:
              for attempt, test_student in enumerate(test_students, start=1):
                  attempted_students.append(test_student)
                  attempt_tag = f"{run_id}-{attempt}"
                  credentials_url, credentials_page = post(
                      admin,
                      "/admin/students/create",
                      {
                          "student_number": test_student,
                          "first_name": "Step",
                          "last_name": "Five Verification",
                          "email": f"{test_student.lower()}@example.invalid",
                      },
                      f"gha-{attempt_tag}-student-create",
                  )
                  if not credentials_url.endswith("/admin/student-credentials"):
                      raise SystemExit(f"Attempt {attempt}: temporary student was not created.")
                  match = re.search(
                      r"Temporary password:</strong>\s*<code>([^<]+)</code>",
                      credentials_page,
                  )
                  if not match:
                      raise SystemExit(f"Attempt {attempt}: temporary password was not returned.")
                  temporary_password = html.unescape(match.group(1))
                  student = build_opener(HTTPCookieProcessor(CookieJar()))

                  change_url, _ = post(
                      student,
                      "/login",
                      {"login_id": test_student, "password": temporary_password},
                      f"gha-{attempt_tag}-student-login",
                  )
                  if not change_url.endswith("/change-password"):
                      raise SystemExit(f"Attempt {attempt}: student login failed.")

                  new_password = secrets.token_urlsafe(18)
                  dashboard_url, dashboard = post(
                      student,
                      "/change-password",
                      {"password": new_password, "confirm_password": new_password},
                      f"gha-{attempt_tag}-student-dashboard",
                  )
                  if not dashboard_url.endswith("/student") or test_student not in dashboard:
                      raise SystemExit(f"Attempt {attempt}: student dashboard check failed.")
                  print(f"smoke_attempt={attempt}/5 passed", flush=True)
          finally:
              with psycopg2.connect(os.environ["DATABASE_URL"]) as database:
                  with database.cursor() as cursor:
                      if attempted_students:
                          cursor.execute(
                              "DELETE FROM enrolments WHERE student_id IN "
                              "(SELECT id FROM students WHERE student_number = ANY(%s))",
                              (attempted_students,),
                          )
                          cursor.execute(
                              "DELETE FROM students WHERE student_number = ANY(%s)",
                              (attempted_students,),
                          )
                          cursor.execute(
                              "DELETE FROM users WHERE username = ANY(%s)",
                              ([f"student_{student}" for student in attempted_students],),
                          )
                          cursor.execute(
                              "SELECT COUNT(*) FROM students WHERE student_number = ANY(%s)",
                              (attempted_students,),
                          )
                          if cursor.fetchone()[0] != 0:
                              raise SystemExit("Verification cleanup left a temporary student row.")

          print("Five consecutive administrator/student login and dashboard checks passed; their temporary rows were removed.")
          PY

      - name: Restore previous runtime and verify health
        if: always() && steps.previous.outcome == 'success' && (steps.health.outcome == 'failure' || steps.deploy.outcome != 'success' || steps.verify-logins.outcome == 'failure')
        continue-on-error: true
        env:
          PREVIOUS_RUNTIME: ${{ steps.previous.outputs.runtime }}
        run: |
          if [[ -z "$PREVIOUS_RUNTIME" ]]; then
            echo "No previous runtime was recorded; cannot restore automatically." >&2
            exit 1
          fi
          bash scripts/deploy-container.sh --restore "$PREVIOUS_RUNTIME"
          restored_runtime="$(az webapp config show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query linuxFxVersion --output tsv)"
          if [[ "$restored_runtime" != "$PREVIOUS_RUNTIME" ]]; then
            echo "Restored runtime '$restored_runtime' does not match previous image '$PREVIOUS_RUNTIME'." >&2
            exit 1
          fi
          echo "Confirmed previous image restored: $restored_runtime"

          health_url="https://sms-student-management-20261103.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 4 "$health_url"; then
              echo "Previous runtime restored and healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Restored runtime did not become healthy." >&2
          exit 1

      - name: Fail deployment after unsuccessful update or rollback
        if: always() && (steps.health.outcome == 'failure' || steps.deploy.outcome != 'success' || steps.verify-logins.outcome == 'failure')
        run: exit 1

  deploy-notifier:
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [deploy-app-service, publish-image]
    concurrency:
      group: sms-app-service-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: dfd6e7ba-fca0-482a-a91c-fa4b3143446d
      AZURE_TENANT_ID: 816691e0-63cf-49e9-be3f-b237b7e2f6ca
      AZURE_SUBSCRIPTION_ID: 74577974-a069-4c7e-90ea-9f06a0aaa0f5
      AZURE_RESOURCE_GROUP: work
      AZURE_WEBAPP_NAME: sms-student-management-20261103
      AZURE_NOTIFIER_WEBAPP_NAME: sms-student-management-20261103-notifier
      AZURE_SERVICEBUS_NAMESPACE_FQDN: sms-student-events-20261104.servicebus.windows.net

    steps:
      - name: Confirm worker image is anonymously pullable
        run: docker pull "ghcr.io/xipasha/monolithic-student-management-system-notifier:${{ github.sha }}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy worker, health check and restore previous image on failure
        env:
          IMAGE: ghcr.io/xipasha/monolithic-student-management-system-notifier:${{ github.sha }}
        run: |
          previous_runtime="$(az webapp config show \
            --name "$AZURE_NOTIFIER_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query linuxFxVersion --output tsv)"
          if [[ -z "$previous_runtime" || "$previous_runtime" == "None" ]]; then
            echo "Could not determine the previous worker image." >&2
            exit 1
          fi

          az webapp config container set \
            --name "$AZURE_NOTIFIER_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$IMAGE" --container-registry-url https://ghcr.io --output none
          az webapp config appsettings set \
            --name "$AZURE_NOTIFIER_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_PORT=8000 PORT=8000 --output none

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 4 \
              "https://${AZURE_NOTIFIER_WEBAPP_NAME}.azurewebsites.net/health"; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != "true" ]]; then
            echo "Worker health check failed; restoring $previous_runtime." >&2
            az webapp config set --name "$AZURE_NOTIFIER_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" --linux-fx-version "$previous_runtime" --output none
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 4 \
                "https://${AZURE_NOTIFIER_WEBAPP_NAME}.azurewebsites.net/health"; then
                echo "Previous worker is healthy again."
                exit 1
              fi
              sleep 2
            done
            echo "Worker rollback failed its health check." >&2
            exit 1
          fi

      - name: Enable notifications after worker health succeeds
        run: |
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings NOTIFICATIONS_ENABLED=true --output none
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 4 \
              "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"; then
              exit 0
            fi
            sleep 2
          done
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings NOTIFICATIONS_ENABLED=false --output none
          echo "Monolith health check failed after enabling; notifications were disabled again." >&2
          exit 1

  deploy-courses-service:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.COURSES_SERVICE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [publish-image]
    concurrency:
      group: sms-courses-service-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: dfd6e7ba-fca0-482a-a91c-fa4b3143446d
      AZURE_TENANT_ID: 816691e0-63cf-49e9-be3f-b237b7e2f6ca
      AZURE_SUBSCRIPTION_ID: 74577974-a069-4c7e-90ea-9f06a0aaa0f5
      AZURE_RESOURCE_GROUP: work
      COURSES_ENVIRONMENT_NAME: sms-courses-aca-env
      COURSES_CONTAINER_APP_NAME: sms-courses-api
      COURSES_MIN_REPLICAS: ${{ vars.COURSES_SERVICE_MIN_REPLICAS || '0' }}

    steps:
      - name: Confirm image is anonymously pullable from GHCR
        run: docker pull "ghcr.io/xipasha/monolithic-student-management-system:${{ github.sha }}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Update courses service secrets and image
        env:
          COURSES_SERVICE_TOKEN: ${{ secrets.COURSES_SERVICE_TOKEN }}
          COURSES_DATABASE_URL: ${{ secrets.COURSES_DATABASE_URL }}
          IMAGE: ghcr.io/xipasha/monolithic-student-management-system:${{ github.sha }}
        run: |
          if [[ -z "$COURSES_SERVICE_TOKEN" || -z "$COURSES_DATABASE_URL" ]]; then
            echo "Courses service secrets are not configured." >&2
            exit 1
          fi
          if [[ "$COURSES_MIN_REPLICAS" != "0" && "$COURSES_MIN_REPLICAS" != "1" ]]; then
            echo "COURSES_SERVICE_MIN_REPLICAS must be 0 or 1." >&2
            exit 1
          fi
          if az containerapp show --name "$COURSES_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az containerapp secret set --name "$COURSES_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "courses-service-token=$COURSES_SERVICE_TOKEN" \
                "courses-database-url=$COURSES_DATABASE_URL" --output none
            az containerapp update --name "$COURSES_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" --image "$IMAGE" \
              --min-replicas "$COURSES_MIN_REPLICAS" --max-replicas 3 \
              --set-env-vars PORT=8000 \
                APP_MODULE=services.courses.app:app \
                COURSES_SERVICE_TOKEN=secretref:courses-service-token \
                DATABASE_URL=secretref:courses-database-url --output none
          else
            az containerapp create --name "$COURSES_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$COURSES_ENVIRONMENT_NAME" --image "$IMAGE" \
              --ingress external --target-port 8000 \
              --transport auto --cpu 0.25 --memory 0.5Gi \
              --min-replicas "$COURSES_MIN_REPLICAS" --max-replicas 3 \
              --scale-rule-name http-requests --scale-rule-http-concurrency 10 \
              --secrets "courses-service-token=$COURSES_SERVICE_TOKEN" \
                "courses-database-url=$COURSES_DATABASE_URL" \
              --env-vars PORT=8000 \
                APP_MODULE=services.courses.app:app \
                COURSES_SERVICE_TOKEN=secretref:courses-service-token \
                DATABASE_URL=secretref:courses-database-url
          fi

          app_url="https://$(az containerapp show --name "$COURSES_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          echo "Courses service deployed at $app_url"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 4 "$app_url/health"; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != "true" ]]; then
            echo "Courses service health check did not pass." >&2
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 5 \
            --header "Authorization: Bearer $COURSES_SERVICE_TOKEN" "$app_url/ready"; then
            echo "Courses service database readiness check failed; verify PostgreSQL firewall and role settings." >&2
            exit 1
          fi
