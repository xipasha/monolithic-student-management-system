
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 18px; color: #222; }
        nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 14px; }
        a { color: #1456a0; } section, .panel { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 18px 0; }
        input, select, textarea, button { padding: 9px; margin: 4px 0; max-width: 100%; }
        input, textarea, select { box-sizing: border-box; }
        form { margin: 8px 0; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 9px; text-align: left; border-bottom: 1px solid #ddd; }
        .message { padding: 10px; background: #eee; margin: 10px 0; }
        .error { color: #a00; } .success { color: #075c2b; }
        .muted { color: #666; font-size: .9em; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}"><strong>Student Management System</strong></a>
        {% if g.user is defined and g.user %}
            <span>{{ g.user.username }} ({{ g.user.role }})
                <form method="post" action="{{ url_for('logout') }}" style="display:inline">
                    <button type="submit">Log out</button>
                </form>
            </span>
        {% endif %}
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
