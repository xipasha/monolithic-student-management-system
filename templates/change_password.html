
{% extends "base.html" %}
{% block title %}Change Password | SMS{% endblock %}
{% block content %}
<section style="max-width:480px">
    <h1>Change your initial password</h1>
    <p>You must set a new password before accessing the system.</p>
    <form method="post">
        <label for="password">New password (at least 10 characters)</label><br>
        <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><br>
        <label for="confirm_password">Confirm password</label><br>
        <input id="confirm_password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password"><br>
        <button type="submit">Change password</button>
    </form>
</section>
{% endblock %}
